name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: |
          dotnet restore LLMEval/LLMEval.csproj
          dotnet restore LLMEval.Tests/LLMEval.Tests.csproj

      - name: Build and test
        run: dotnet test LLMEval.Tests/LLMEval.Tests.csproj --configuration Release --verbosity normal
