name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  LLMEVAL_REPORT_DIR: ${{ github.workspace }}/artifacts/llmeval

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: |
          # Do not restore LLMEval.sln — it includes LLMEvalTool (net10.0-windows WinForms),
          # which fails on ubuntu-latest without EnableWindowsTargeting.
          dotnet restore LLMEval.Abstractions/LLMEval.Abstractions.csproj
          dotnet restore LLMEval.Core/LLMEval.Core.csproj
          dotnet restore LLMEval/LLMEval.csproj
          dotnet restore LLMEval.SemanticKernel/LLMEval.SemanticKernel.csproj
          dotnet restore LLMEval.Tests/LLMEval.Tests.csproj
          dotnet restore samples/QuickStart/QuickStart.csproj
          dotnet restore samples/OpenAIJudge/OpenAIJudge.csproj
          dotnet restore samples/MinimalXunit/MinimalXunit.csproj
          dotnet restore benchmarks/LLMEval.Benchmarks/LLMEval.Benchmarks.csproj

      - name: Build and test (library)
        run: dotnet test LLMEval.Tests/LLMEval.Tests.csproj --configuration Release --verbosity normal

      - name: Run QuickStart sample (zero API keys)
        run: dotnet test samples/QuickStart/QuickStart.csproj --configuration Release --verbosity normal

      - name: Run OpenAIJudge sample (skips without OPENAI_API_KEY)
        run: dotnet test samples/OpenAIJudge/OpenAIJudge.csproj --configuration Release --verbosity normal

      - name: Run MinimalXunit sample (pass-rate gate)
        run: |
          mkdir -p "$LLMEVAL_REPORT_DIR"
          dotnet test samples/MinimalXunit/MinimalXunit.csproj \
            --configuration Release \
            --verbosity normal \
            --filter "Category=LLMEval"

      - name: Benchmarks smoke (short in-process)
        run: |
          dotnet run -c Release --project benchmarks/LLMEval.Benchmarks/LLMEval.Benchmarks.csproj -- \
            --filter "*"

      - name: Pack (verify nupkg)
        run: |
          mkdir -p ./nupkg
          dotnet pack LLMEval.Abstractions/LLMEval.Abstractions.csproj --configuration Release --output ./nupkg
          dotnet pack LLMEval.Core/LLMEval.Core.csproj --configuration Release --output ./nupkg
          dotnet pack LLMEval/LLMEval.csproj --configuration Release --output ./nupkg
          dotnet pack LLMEval.SemanticKernel/LLMEval.SemanticKernel.csproj --configuration Release --output ./nupkg

      - name: Upload LLMEval report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llmeval-reports
          path: artifacts/llmeval/**
          if-no-files-found: warn
          retention-days: 14
