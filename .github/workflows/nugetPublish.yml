name: Publish NuGet Package
on:
  push:
    tags:
      - 'v*.*.*'   # Triggers on version tags like v1.0.0
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      
      - name: Restore dependencies
        run: dotnet restore LLMEval/LLMEval.csproj
      
      - name: Build
        run: dotnet build LLMEval/LLMEval.csproj --configuration Release --no-restore
      
      - name: Pack
        run: dotnet pack LLMEval/LLMEval.csproj --configuration Release --no-build --output ./nupkg
      
      - name: List generated packages
        run: dir nupkg
      
      - name: Publish to NuGet
        shell: pwsh
        run: |
          $packagePath = Get-ChildItem -Path "./nupkg" -Filter "STAF.LLMEval.*.nupkg" | Select-Object -First 1 -ExpandProperty FullName
          if ($packagePath) {
            Write-Host "Publishing package: $packagePath"
            dotnet nuget push $packagePath --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
          } else {
            Write-Host "No package found matching pattern STAF.LLMEval.*.nupkg in ./nupkg directory"
            exit 1
          }