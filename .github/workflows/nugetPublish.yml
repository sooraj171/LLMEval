name: Publish NuGet Package
on:
  push:
    tags:
      - 'v*.*.*'   # Triggers on version tags like v1.0.0
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      
      - name: Restore dependencies
        run: dotnet restore LLMEval/LLMEval.csproj
      
      - name: Build
        run: dotnet build LLMEval/LLMEval.csproj --configuration Release --no-restore
      
      - name: Pack
        run: dotnet pack LLMEval/LLMEval.csproj --configuration Release --no-build -o nupkg
      
      - name: List directories to debug
        run: |
          echo "Current directory:"
          pwd
          echo "Directory listing of root:"
          dir
          echo "Directory listing of nupkg folder:"
          dir nupkg || echo "nupkg directory not found"
          echo "Directory listing of LLMEval/bin/Release:"
          dir LLMEval/bin/Release || echo "LLMEval/bin/Release directory not found"
      
      - name: Publish to NuGet
        run: dotnet nuget push "$(pwd)/nupkg/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate