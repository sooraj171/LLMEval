name: Publish NuGet Package
on:
  push:
    tags:
      - 'v*.*.*'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: |
          dotnet restore LLMEval.sln
          dotnet restore LLMEval.Tests/LLMEval.Tests.csproj

      - name: Test
        run: dotnet test LLMEval.Tests/LLMEval.Tests.csproj --configuration Release --verbosity normal

      - name: Pack
        run: |
          mkdir -p ./nupkg
          dotnet pack LLMEval.Abstractions/LLMEval.Abstractions.csproj --configuration Release --output ./nupkg
          dotnet pack LLMEval.Core/LLMEval.Core.csproj --configuration Release --output ./nupkg
          dotnet pack LLMEval/LLMEval.csproj --configuration Release --output ./nupkg
          dotnet pack LLMEval.SemanticKernel/LLMEval.SemanticKernel.csproj --configuration Release --output ./nupkg

      - name: List generated packages
        run: ls -la nupkg

      - name: Publish to NuGet
        shell: bash
        run: |
          set -euo pipefail
          for packagePath in ./nupkg/STAF.LLMEval*.nupkg; do
            case "$packagePath" in
              *.snupkg) continue ;;
            esac
            echo "Publishing package: $packagePath"
            dotnet nuget push "$packagePath" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
          for symbols in ./nupkg/STAF.LLMEval*.snupkg; do
            [ -e "$symbols" ] || continue
            echo "Publishing symbols: $symbols"
            dotnet nuget push "$symbols" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
