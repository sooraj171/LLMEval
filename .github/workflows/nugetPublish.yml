name: Publish NuGet Package
on:
  push:
    tags:
      - 'v*.*.*'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: |
          dotnet restore LLMEval/LLMEval.csproj
          dotnet restore LLMEval.Tests/LLMEval.Tests.csproj

      - name: Test
        run: dotnet test LLMEval.Tests/LLMEval.Tests.csproj --configuration Release --verbosity normal

      - name: Pack
        run: dotnet pack LLMEval/LLMEval.csproj --configuration Release --output ./nupkg

      - name: List generated packages
        run: ls -la nupkg

      - name: Publish to NuGet
        shell: bash
        run: |
          packagePath=$(ls ./nupkg/STAF.LLMEval.*.nupkg | grep -v snupkg | head -n 1)
          if [ -n "$packagePath" ]; then
            echo "Publishing package: $packagePath"
            dotnet nuget push "$packagePath" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
            symbols=$(ls ./nupkg/STAF.LLMEval.*.snupkg 2>/dev/null | head -n 1 || true)
            if [ -n "$symbols" ]; then
              dotnet nuget push "$symbols" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
            fi
          else
            echo "No package found matching STAF.LLMEval.*.nupkg"
            exit 1
          fi
